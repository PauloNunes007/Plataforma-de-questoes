  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <rect x="6.35" y="19.6" width="3.4" height="4.8" rx="1.7" fill="#fff" opacity=".5"/>
  <rect x="11.65" y="16.6" width="3.4" height="7.8" rx="1.7" fill="#fff" opacity=".68"/>
  <rect x="16.95" y="12.4" width="3.4" height="12" rx="1.7" fill="#fff" opacity=".84"/>
  <rect x="22.25" y="7.6" width="3.4" height="16.8" rx="1.7" fill="#fff"/>
</svg>
